# ─── Shared environment ───────────────────────────────────────────────────────
x-common-env: &common-env
  POSTGRES_USER: ${POSTGRES_USER:-rag_admin}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
  POSTGRES_DB: ${POSTGRES_DB:-rag_core_db}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  MONGO_USER: ${MONGO_USER:-admin}
  MONGO_PASSWORD: ${MONGO_PASSWORD:-admin123}
  MONGO_HOST: mongodb
  MONGO_PORT: "27017"
  MONGO_DB: ${MONGO_DB:-rag_audit_log}
  REDIS_URL: redis://redis:6379/0
  QDRANT_HOST: qdrant
  QDRANT_PORT: "6333"
  OLLAMA_BASE_URL: http://ollama:11434
  OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
  OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-512}
  LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
  VLLM_BASE_URL: ${VLLM_BASE_URL:-http://vllm:8000/v1}
  VLLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen3-8B}
  VLLM_API_KEY: ${VLLM_API_KEY:-local-vllm}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
  EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
  OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
  CORE_API_URL: http://core_api:8000
  CORE_API_HOST_HEADER: ${CORE_API_HOST_HEADER:-localhost}
  RAG_API_URL: http://rag_api:8001
  UPLOAD_DIR: /tmp/uploads
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-change-in-prod}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
  CORS_ALLOW_ALL_ORIGINS: ${CORS_ALLOW_ALL_ORIGINS:-true}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
  KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://keycloak:8080/realms/rag-saas}
  KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL:-http://keycloak:8080/realms/rag-saas/protocol/openid-connect/certs}
  KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-rag-saas}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  RAG_INTERNAL_INGEST_TOKEN: ${RAG_INTERNAL_INGEST_TOKEN:-dev-ingest-token-change-in-prod}
  SCHEDULER_TRIGGER_TOKEN: ${SCHEDULER_TRIGGER_TOKEN:-dev-scheduler-token-change-in-prod}

services:
  # ─── Infrastructure ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-rag_core_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag_admin}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mongodb:
    image: mongo:6
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin123}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # CPU-only: no GPU deploy section. Add gpus: all later for GPU upgrade.
    restart: unless-stopped

  # ─── Application Services ────────────────────────────────────────────────────
  core_api:
    build:
      context: ./core_backend
      dockerfile: Dockerfile
    environment:
      <<: *common-env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./core_backend:/app
    restart: unless-stopped

  rag_api:
    build:
      context: ./rag_backend
      dockerfile: Dockerfile
    environment:
      <<: *common-env
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - ./rag_backend:/app
      - upload_data:/tmp/uploads
    restart: unless-stopped

  celery_worker:
    build:
      context: ./rag_backend
      dockerfile: Dockerfile
    command: celery -A celery_app worker --loglevel=info -P solo -Q default,celery
    environment:
      <<: *common-env
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - ./rag_backend:/app
      - upload_data:/tmp/uploads
    restart: unless-stopped

  celery_beat:
    build:
      context: ./rag_backend
      dockerfile: Dockerfile
    command: celery -A celery_app beat --loglevel=info
    environment:
      <<: *common-env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./rag_backend:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_CORE_API_URL: http://localhost:8000
      NEXT_PUBLIC_RAG_API_URL: http://localhost:8001
    ports:
      - "3000:3000"
    depends_on:
      - core_api
      - rag_api
    restart: unless-stopped

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  qdrant_data:
  ollama_data:
  upload_data:
